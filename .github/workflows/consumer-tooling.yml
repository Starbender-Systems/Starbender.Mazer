name: Validate consumer tooling

on:
  pull_request:
    paths:
      - 'docs/consumers/**'
      - 'plugins/**'
      - '.agents/plugins/marketplace.json'
      - 'tools/consumer_tooling.py'
      - 'tools/check_consumer_recipes.py'
      - 'tools/ConsumerRecipes/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.editorconfig'
      - '.gitattributes'
      - 'NuGet.Config'
      - '.github/workflows/consumer-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile documented recipes and inventory source APIs
        run: python tools/check_consumer_recipes.py
      - name: Validate catalog and portable links
        run: python tools/consumer_tooling.py validate . --inventory artifacts/consumer/inventory.json
      - name: Assemble review preview
        run: python tools/consumer_tooling.py bundle . --output "${{ runner.temp }}/consumer-tooling" --allow-dirty-preview --inventory artifacts/consumer/inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: 'starbender-mazer-consumer-preview'
          path: '${{ runner.temp }}/consumer-tooling/'
          if-no-files-found: error
